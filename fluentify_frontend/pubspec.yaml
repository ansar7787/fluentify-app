name: fluentify
description: SpeakPay - English Speaking Learning App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # STATE MANAGEMENT
  bloc: ^8.1.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.8
  dartz: ^0.10.1

  # HTTP & NETWORKING
  dio: ^5.9.0
  connectivity_plus: ^5.0.0
  internet_connection_checker: ^1.0.0

  # LOCAL STORAGE & CACHE
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  isar: ^3.1.0
  hive: ^2.2.3

  # PAYMENTS
  razorpay_flutter: ^1.4.0

  # AUDIO & SPEECH
  record: ^6.1.2
  just_audio: ^0.10.5
  speech_to_text: ^7.3.0
  flutter_tts: ^3.8.5

  # NOTIFICATIONS
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0
  flutter_local_notifications: ^18.0.0

  # ANALYTICS & CRASH REPORTING
  firebase_analytics: ^11.0.0
  sentry_flutter: ^9.10.0

  # AUTHENTICATION & SECURITY
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.2
  jwt_decoder: ^2.0.1

  # MAPS & LOCATION
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  geocoding: ^2.1.0

  # REALTIME & PEER
  agora_rtc_engine: "^6.3.2"
  permission_handler: "^11.3.1"
  socket_io_client: "^2.0.3+1"

  # IMAGE & MEDIA
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # UI & DESIGN
  flutter_svg: ^2.0.8
  animations: ^2.0.7
  lottie: ^2.4.0
  smooth_page_indicator: ^1.1.0
  intl: ^0.20.2
  get_it: ^9.2.0
  provider: ^6.0.5

  # UTIL & HELPER
  logger: ^2.0.1
  uuid: ^4.0.1
  path_provider: ^2.1.5
  flutter_screenutil: ^5.9.3
  path: ^1.9.0
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0




  flutter_lints: ^3.0.0
  bloc_test: ^9.1.0
  mockito: ^5.4.4
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
